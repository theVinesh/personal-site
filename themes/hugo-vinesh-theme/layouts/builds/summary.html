<div class="summary">
    <h2 class="summary-title">
        <a href="{{ printf "/builds/%s" .File.ContentBaseName | relURL }}">{{ .Title }}</a>
    </h2>
    {{ if .Params.image }}
    {{ $image := .Resources.Get .Params.image }}
    {{ if $image }}
    <img alt="{{.Params.imageAltAttribute | default " Project hero image"}}" src="{{ $image.RelPermalink }}" />
    {{ end }}
    {{ end }}
    <p class="summary-description">
        {{ if .Params.description }}
        {{ .Params.description }}
        {{ else }}
        {{ .Summary }}
        {{ end }}
    </p>
    <div class="summary-links">
        {{ range .Params.links }}
        <a class="summary-readmore" href="{{ . }}" target="_blank" rel="noopener noreferrer">
            {{ partial "icon.html" . }}
        </a>
        {{ end }}
    </div>
</div>
