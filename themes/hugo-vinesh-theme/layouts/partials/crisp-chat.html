<script>
    window.$crisp = window.$crisp || [];
    window.CRISP_WEBSITE_ID = "3289a012-9831-4413-9574-2118579bee8b";

    (function () {
        function injectCrisp() {
            if (document.getElementById("crisp-chat-script")) return;

            var script = document.createElement("script");
            script.id = "crisp-chat-script";
            script.src = "https://client.crisp.chat/l.js";
            script.async = true;
            script.onerror = function () {
                console.warn("Crisp chat failed to load.");
            };
            document.head.appendChild(script);
        }

        function arm() {
            // Load chat only once the visitor shows intent (or as a 15s safety fallback).
            var events = ["pointerdown", "mousemove", "scroll", "touchstart", "keydown"];
            events.forEach(function (e) {
                window.addEventListener(e, injectCrisp, { once: true, passive: true });
            });
            window.setTimeout(injectCrisp, 15000);
        }

        if (document.readyState === "complete") {
            arm();
        } else {
            window.addEventListener("load", arm, { once: true });
        }
    }());
</script>
